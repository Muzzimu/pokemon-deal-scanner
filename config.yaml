version: "0.8.2"
timezone: Europe/Dublin

sources:
  cardmarket_catalog_url: https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_6.json
  cardmarket_price_url: https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_6.json
  cardtrader_base_url: https://api.cardtrader.com/api/v2

paths:
  database: db/pokemon_deal_scanner.sqlite
  raw_dir: data/raw/cardmarket
  output_dir: output
  en_nm_overrides: data/reference/en_nm_overrides.csv
  cardmarket_sourcing_offers: data/reference/cardmarket_sourcing_offers.csv
  ebay_watchlist: data/reference/ebay_watchlist.csv
  ebay_sold_evidence: data/reference/ebay_sold_evidence.csv
  market_events: data/reference/market_events.csv
  gumtree_watchlist: data/reference/gumtree_watchlist.csv

catalog:
  refresh_weekday: 4
  refresh_if_older_days: 7

rules:
  # IMPORTANT: Cardmarket's official "low" is NOT English+NM-specific.
  # It is discovery-only and cannot drive gap_pct, flip ranking, or a BUY signal.
  # Top-flip qualification requires validated English/NM acquisition evidence.
  # A Cardmarket BUY additionally requires Ireland-eligible sourcing evidence and
  # a confirmed landed/basket-adjusted cost.
  cheap_hit_discovery_low_max_eur: 0.50
  cheap_hit_actionable_en_nm_max_eur: 0.60
  minimum_avg30_for_gap_score_eur: 0.20
  minimum_gap_pct: 20
  min_product_age_days_for_flip_signal: 14
  max_report_rows: 250

  hit_patterns:
    - '\bex\b'
    - '\bV\b'
    - '\bVSTAR\b'
    - '\bVMAX\b'
    - '\bGX\b'
    - '\bMega\b'

  popularity:
    Dragonite: 1.00
    Pikachu: 1.00
    Charizard: 1.00
    Eevee: 0.95
    Gengar: 0.95
    Mew: 0.95
    Mewtwo: 0.95
    Rayquaza: 0.95
    Lugia: 0.90
    Greninja: 0.90
    Lucario: 0.85
    Gyarados: 0.85
    Arcanine: 0.80
    Bulbasaur: 0.80
    Squirtle: 0.80
    Charmander: 0.85
    Snorlax: 0.80
    Morpeko: 0.75
    Zeraora: 0.75

cardtrader:
  enabled: true
  token_env: CARDTRADER_API_TOKEN
  language: en
  actionable_en_nm_max_eur: 0.60
  candidate_generic_low_max_eur: 1.00
  max_candidate_products: 400
  # In addition to cheap/popular discovery candidates, always bring a bounded
  # set of validated Cardmarket sourcing products into the CT marketplace sync so
  # the route engine can evaluate Cardmarket -> CardTrader exits on the same run.
  resale_validated_product_limit: 250
  auto_bootstrap_if_empty: true
  marketplace_delay_seconds: 1.05
  other_delay_seconds: 0.08

cardtrader_resale:
  enabled: true
  # Conservative post-March-2026 EU seller rates. VAT is added to the commission
  # by CardTrader; 23% is the Ireland-tuned planning default. Change these values
  # if the account qualifies for grandfathered rates or different VAT treatment.
  direct_fee_pct: 5.3
  zero_fee_pct: 7.3
  fee_vat_pct: 23.0
  minimum_fee_eur: 0.01
  # Active marketplace asks are not sold prices. The model assumes a listing just
  # below the current English/NM competitive floor and requires seller depth.
  undercut_eur: 0.01
  minimum_competing_sellers: 2
  # Small configurable planning reserves prevent Direct packaging and weekly Zero
  # hub shipment from being silently treated as free. They are not platform fees.
  direct_operational_reserve_eur: 0.15
  zero_operational_reserve_eur: 0.50
  # Fallback thresholds for any acquisition cost not covered by a price band.
  minimum_net_spread_eur: 2.00
  minimum_net_roi_pct: 25.0
  # Capital/risk-sensitive gates. Higher-value cards need larger absolute profit
  # even when percentage ROI still looks attractive.
  price_bands:
    - label: MICRO_0_10
      max_acquisition_eur: 10
      min_net_spread_eur: 2.50
      min_net_roi_pct: 35.0
    - label: LOW_10_30
      max_acquisition_eur: 30
      min_net_spread_eur: 5.00
      min_net_roi_pct: 30.0
    - label: MID_30_50
      max_acquisition_eur: 50
      min_net_spread_eur: 8.00
      min_net_roi_pct: 25.0
    - label: HIGH_50_100
      max_acquisition_eur: 100
      min_net_spread_eur: 15.00
      min_net_roi_pct: 25.0
    - label: PREMIUM_100_PLUS
      max_acquisition_eur: null
      min_net_spread_eur: 25.00
      min_net_roi_pct: 20.0
  # Above this acquisition cost an otherwise-valid edge is watch-only until a
  # human checks photos/condition/variant and the exact exit route.
  manual_verify_above_eur: 100.0
  # Used only when comparing CT net proceeds with the existing eBay exit route.
  ebay_exit_cost_pct: 8.0
  # Populate if the user's own CardTrader seller account later appears in the
  # marketplace feed; self-listings must never establish the competitive floor.
  excluded_seller_usernames: []

core_watch:
  # Dynamic liquid-card universe built from cards for which we already have
  # validated sourcing and CT coverage. It is deliberately evidence-driven rather
  # than a hard-coded list of famous Pokemon.
  min_reference_value_eur: 15.0
  max_reference_value_eur: 120.0
  minimum_ct_sellers: 2
  minimum_ct_units: 2
  require_ebay_or_three_ct_sellers: true
  max_rows: 100

cardmarket_live:
  # v0.8.2: targeted live-offer validation. The production baseline remains the
  # official Cardmarket catalogue/price-guide downloads. This layer only checks a
  # small number of high-priority Core-watch gaps through an external REST provider.
  enabled: true
  provider: parsebot
  api_key_env: PARSE_API_KEY
  base_url: https://api.parse.bot/scraper/6e8ae7ea-a15a-4125-aada-1e116c8060b5
  endpoint: get_card_listings
  game: Pokemon
  language: English
  min_condition: NM
  max_candidates_per_run: 20
  watch_priorities:
    - A
    - B
  minimum_ct_lag_score: 40
  robust_floor_sample_size: 3
  minimum_live_sellers: 2
  stale_upward_pct: 10.0
  cheaper_candidate_pct: 10.0
  timeout_seconds: 30
  # Conservative enough for Parse's current free-tier 5 req/min limit; reduce only
  # if the connected plan explicitly permits a higher request rate.
  request_delay_seconds: 12.5

sourcing:
  required_language: en
  required_condition: NM
  required_destination: Ireland
  seller_risk_max_penalty_eur: 1.50
  # Planning floor: median of the cheapest N eligible offers after filtering out
  # very small seller histories. Individual low offers are still visible/actionable.
  robust_floor_sample_size: 3
  robust_floor_min_samples: 2
  robust_floor_min_seller_sales: 10

seller_baskets:
  max_unit_price_eur: 0.70
  min_distinct_hits: 5
  max_copies_per_card: 4
  max_units_per_seller: 30
  target_landed_per_hit_eur: 0.60
  planning_direct_shipping_eur: 2.00
  max_report_rows: 100

local_cherry_pick:
  # Discovery must come from user-supplied pages or third-party public search
  # indexes/archives; do not directly crawl Adverts.ie.
  required_language: en
  required_condition: NM
  minimum_discount_pct: 20.0
  minimum_absolute_discount_eur: 1.50
  watch_discount_pct: 10.0
  default_postage_eur: 2.00
  default_postage_up_to_cards: 10
  require_verified_en_nm_reference: true
  # Dense binder/photo listings are prone to look-alike printings. Never issue a
  # BUY/deal signal from visual resemblance alone: verify the exact printing first.
  # At minimum confirm set + collector number and any value-changing variant such
  # as holo/non-holo, reverse, stamp/promo, language or edition. If the photo is too
  # unclear, label the identification uncertain and ask for a close-up/card number.
  require_exact_printing_before_price_signal: true
  uncertain_identification_action: watch_only
  identification_required_fields:
    - set
    - collector_number
    - value_changing_variant
  preferred_traits:
    - stamped
    - promo
    - vintage
    - older_holo
    - scarce_variant
    - popular_pokemon
  sellers:
    Rocco_jr:
      platform: Adverts.ie
      public_member_url: https://www.adverts.ie/member/470512
      legacy_user_id: 1462668
      location: Tullamore, Offaly
      postage_eur: 2.00
      postage_up_to_cards: 10
      role: high_retail_ceiling_and_cherry_pick_source

watchlists:
  dragonite:
    query: Dragonite
    target_support_cost_eur: 1.75
    standalone_buy_max_landed_eur: 9.00
    bundle_buy_max_landed_eur: 10.50
    exceptional_landed_eur: 8.50

bundles:
  characters:
    - Dragonite
    - Pikachu
    - Gengar
    - Eevee
    - Greninja
    - Lucario
    - Gyarados
    - Arcanine
  cards_per_bundle: 5
  hero_count: 1
  max_generic_discovery_cost_eur: 12.00
  max_validated_en_nm_cost_eur: 16.00

ebay:
  # Optional live source. If credentials are absent the scanner still runs and can
  # consume manually recorded sold evidence without inventing a live eBay price.
  enabled: true
  app_id_env: EBAY_APP_ID
  cert_id_env: EBAY_CERT_ID
  oauth_url: https://api.ebay.com/identity/v1/oauth2/token
  search_url: https://api.ebay.com/buy/browse/v1/item_summary/search
  search_limit: 50
  max_watch_products: 20
  search_delay_seconds: 0.12
  timeout_seconds: 20
  confirm_missing_days: 1
  quick_sale_max_days: 3
  sold_window_days: 30
  strength_window_days: 90
  display_window_days: 14
  marketplaces:
    IRELAND:
      - EBAY_IE
    EU:
      - EBAY_DE
      - EBAY_FR
      - EBAY_IT
      - EBAY_ES
      - EBAY_NL
      - EBAY_BE
      - EBAY_AT
    UK:
      - EBAY_GB
    GLOBAL:
      - EBAY_US
  default_excluded_tokens:
    - psa
    - bgs
    - cgc
    - ace graded
    - graded
    - slab
    - proxy
    - orica
    - custom card
    - metal card
    - digital
    - code card
    - lot of
    - bundle of

resale:
  minimum_gross_spread_eur: 2.00
  minimum_gross_roi_pct: 25.0

market_signals:
  # Uses Cardmarket price history plus the existing eBay observatory. Available
  # supply is the count of exact matched raw eBay listings, not Cardmarket's total
  # offer count. The first 30 days therefore build a baseline before supply and
  # cross-market trend confidence can become HIGH.
  event_lookback_days: 30
  neutral_price_move_pct: 3.0
  strong_price_move_pct: 10.0
  velocity_acceleration_ratio: 1.50
  velocity_cooling_ratio: 0.67
  meaningful_supply_change_pct: 10.0

gumtree:
  enabled: true
  base_url: https://www.gumtree.com
  timeout_seconds: 20
  max_watch_products: 25
  max_listing_price_gbp: 5000
  # Broad discovery remains non-actionable until exact printing, language and
  # condition are verified. Exact watch searches are run separately for NI and UK.
  discovery_sources:
    - region: NORTHERN_IRELAND
      query: pokemon cards
      url: https://www.gumtree.com/for-sale/uk/northern-ireland/srpsearch+pokemon-cards
    - region: GREAT_BRITAIN
      query: pokemon cards
      url: https://www.gumtree.com/for-sale/uk/srpsearch+pokemon+cards
  exact_search_locations:
    NORTHERN_IRELAND: northern-ireland
    GREAT_BRITAIN: uk

fx:
  # Frankfurter publishes ECB-derived daily FX. Fallbacks keep reports usable if
  # the endpoint is unavailable, but fallback FX can never create STRONG_ARBITRAGE.
  url: https://api.frankfurter.app/latest?from=EUR&to=GBP,USD
  timeout_seconds: 10
  fallback_gbp_to_eur: 1.16
  fallback_usd_to_eur: 0.86

arbitrage:
  # Net edge after a conservative exit-cost reserve. These are planning reserves,
  # not assertions about tax/customs/postage obligations for a specific trade.
  minimum_net_spread_eur: 8.0
  minimum_net_roi_pct: 25.0
  exit_cost_pct: 8.0
  require_exact_printing: true
  require_english: true
  require_nm: true
  regions:
    NORTHERN_IRELAND:
      fixed_friction_eur: 2.0
      friction_pct: 2.0
    GREAT_BRITAIN:
      fixed_friction_eur: 7.0
      friction_pct: 10.0

history_retention:
  # Inspired by mature collection trackers: keep detail where it matters without
  # allowing the cached SQLite database to grow without bound.
  cardmarket_daily_days: 90
  cardmarket_weekly_until_days: 365
  cardtrader_raw_offer_days: 30
  ebay_gone_listing_days: 30
