name: Apply compact review controls

on:
  push:
    paths:
      - scripts/apply_compact_review_controls.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply compact review-control patch
        run: python scripts/apply_compact_review_controls.py
      - name: Install dashboard dependency
        run: pip install -r requirements-dashboard.txt
      - name: Validate Streamlit controls and syntax
        run: |
          python - <<'PY'
          import streamlit as st
          assert hasattr(st, "segmented_control")
          assert hasattr(st, "pills")
          PY
          python -m py_compile dashboard/app.py
      - name: Commit compact review controls
        run: |
          if git diff --quiet -- dashboard/app.py docs/DASHBOARD.md; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "pokemon-deal-scanner-dashboard"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard/app.py docs/DASHBOARD.md
          git commit -m "Replace redundant review dropdowns with compact controls"
          git push
