name: Card fundamentals refresh

on:
  workflow_dispatch:
  push:
    paths:
      - 'dashboard/data/card_images.json'
      - 'data/reference/owned_resale_cards.csv'
      - 'scripts/refresh_card_fundamentals.py'
      - '.github/workflows/card_fundamentals_refresh.yml'

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh exact TCGdex fundamentals cache
        run: python scripts/refresh_card_fundamentals.py
      - name: Validate cache contract
        env:
          PYTHONPATH: .:src
        run: pytest -q tests/test_card_fundamentals.py
      - name: Commit fundamentals cache
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- data/reference/card_fundamentals.csv)" ]; then
            echo "No card-fundamentals changes to commit"
            exit 0
          fi
          git config user.name "pokemon-deal-scanner-dashboard"
          git config user.email "actions@users.noreply.github.com"
          git add data/reference/card_fundamentals.csv
          git commit -m "Refresh exact card fundamentals [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
