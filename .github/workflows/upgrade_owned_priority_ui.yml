name: Upgrade owned-card Priority Review UI

on:
  push:
    paths:
      - '.github/workflows/upgrade_owned_priority_ui.yml'
      - 'scripts/patch_owned_priority_ui.py'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch dashboard app
        run: python scripts/patch_owned_priority_ui.py

      - name: Syntax check
        run: python -m py_compile dashboard/app.py dashboard/pages/1_Owned_cards.py

      - name: Commit dashboard upgrade
        shell: bash
        run: |
          if git diff --quiet -- dashboard/app.py; then
            echo "Dashboard app already upgraded"
            exit 0
          fi
          git config user.name "pokemon-deal-scanner-dashboard"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard/app.py
          git commit -m "Make owned-card economics first-class in Priority Review [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
