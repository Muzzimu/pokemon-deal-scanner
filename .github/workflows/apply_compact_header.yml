name: Apply compact dashboard header

on:
  push:
    paths:
      - scripts/apply_compact_header.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply compact header patch
        run: python scripts/apply_compact_header.py
      - name: Validate dashboard syntax
        run: python -m py_compile dashboard/app.py
      - name: Commit compact dashboard header
        run: |
          if git diff --quiet -- dashboard/app.py docs/DASHBOARD.md; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "pokemon-deal-scanner-dashboard"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard/app.py docs/DASHBOARD.md
          git commit -m "Compact dashboard review header"
          git push
