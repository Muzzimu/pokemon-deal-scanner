name: Debug resolve tracked purchases

on:
  push:
    paths:
      - '.github/workflows/debug_resolve_tracked_purchases.yml'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore scanner database state
        uses: actions/cache/restore@v4
        with:
          path: db/pokemon_deal_scanner.sqlite
          key: debug-tracked-${{ github.run_id }}
          restore-keys: |
            pokemon-scanner-db-
      - name: Resolve through exact CardTrader mappings
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3
          conn=sqlite3.connect('db/pokemon_deal_scanner.sqlite')
          conn.row_factory=sqlite3.Row
          targets=[
            ('Dragonite VSTAR','050'),('Dragonite V','076'),('Dragonite ex','159'),
            ('Stunfisk ex','252'),('Drakloak','248'),('Gastly','048'),('Beedrill ex','098'),
            ('Alolan Vulpix V','033'),('Alolan Vulpix VSTAR','034'),
            ('Rillaboom VMAX','023'),('Mega Lucario ex','033'),("Cynthia's Spiritomb",'244'),('Mega Dragonite ex','152'),
          ]
          for name,num in targets:
              rows=conn.execute('''
                SELECT DISTINCT m.id_product,b.blueprint_id,b.name,b.expansion_name,b.collector_number,b.version
                FROM cardtrader_blueprint_map m
                JOIN cardtrader_blueprints b ON b.blueprint_id=m.blueprint_id
                WHERE lower(b.name) LIKE ?
                  AND (b.collector_number=? OR b.collector_number LIKE ? OR b.version LIKE ?)
                ORDER BY m.id_product
              ''',('%'+name.lower()+'%',num,num+'/%','%'+num+'%')).fetchall()
              print('\nTARGET',name,num,'COUNT',len(rows))
              for r in rows: print(dict(r))
          conn.close()
          PY
