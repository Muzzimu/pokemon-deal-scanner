name: Debug resolve tracked purchases

on:
  push:
    paths:
      - '.github/workflows/debug_resolve_tracked_purchases.yml'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect raw Cardmarket product schema
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_6.json'
          req=urllib.request.Request(url, headers={'User-Agent':'pokemon-deal-scanner-debug'})
          with urllib.request.urlopen(req, timeout=90) as r:
              payload=json.load(r)
          rows=payload.get('products') or payload.get('product') or payload.get('data') or []
          for pid in (665687,665676,725239,869763):
              p=next((x for x in rows if int(x.get('idProduct') or 0)==pid),None)
              print('\nPID',pid)
              print(json.dumps(p,ensure_ascii=False,sort_keys=True))
          PY
