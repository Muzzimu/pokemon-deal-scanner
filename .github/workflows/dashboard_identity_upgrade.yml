name: Dashboard identity/source upgrade

on:
  push:
    paths:
      - '.github/workflows/dashboard_identity_upgrade.yml'

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'
  PYTHONPATH: src

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Patch dashboard identity and acquisition source fields
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Cross-price research: explicitly identify the website/source behind the screening acquisition price.
          replace_once(
              'src/deal_scanner/cross_price.py',
              '''        gap_pct = headroom / reference * 100.0\n        acquisition_basis = "VALIDATED_EN_NM" if validated is not None else "CARDMARKET_GENERIC_LOW_SCREENING_ONLY"\n        research_state = "READY_FOR_ROUTE_ECONOMICS" if validated is not None else "NEEDS_VALIDATED_ACQUISITION"\n\n        row.update(\n            {\n                "reference_band": band,\n                "reference_value_eur": round(reference, 2),\n                "reference_basis": "CARDMARKET_AVG30_DIAGNOSTIC",\n                "screening_acquisition_eur": round(screening_price, 2),\n                "acquisition_basis": acquisition_basis,\n''',
              '''        gap_pct = headroom / reference * 100.0\n        acquisition_basis = "VALIDATED_EN_NM" if validated is not None else "CARDMARKET_GENERIC_LOW_SCREENING_ONLY"\n        research_state = "READY_FOR_ROUTE_ECONOMICS" if validated is not None else "NEEDS_VALIDATED_ACQUISITION"\n\n        def numeric(value):\n            try:\n                return None if value in (None, "") else float(value)\n            except (TypeError, ValueError):\n                return None\n\n        cm_floor = numeric(row.get("cm_en_nm_floor"))\n        ct_floor = numeric(row.get("ct_en_nm_floor"))\n        if validated is None:\n            acquisition_source = "CARDMARKET_GENERIC_LOW"\n        else:\n            matches = []\n            if cm_floor is not None and abs(cm_floor - screening_price) < 0.005:\n                matches.append("CARDMARKET_EN_NM")\n            if ct_floor is not None and abs(ct_floor - screening_price) < 0.005:\n                matches.append("CARDTRADER_EN_NM")\n            acquisition_source = "+".join(matches) if matches else "VALIDATED_EN_NM_SOURCE_UNRESOLVED"\n\n        row.update(\n            {\n                "reference_band": band,\n                "reference_value_eur": round(reference, 2),\n                "reference_basis": "CARDMARKET_AVG30_DIAGNOSTIC",\n                "screening_acquisition_eur": round(screening_price, 2),\n                "screening_acquisition_source": acquisition_source,\n                "acquisition_basis": acquisition_basis,\n'''
          )

          # 2) Report schema carries source + identity enrichment into CSV/dashboard.
          replace_once(
              'src/deal_scanner/reports.py',
              '''CROSS_PRICE_FIELDS = COMMON_FIELDS + [\n    "reference_band", "reference_value_eur", "reference_basis",\n    "screening_acquisition_eur", "acquisition_basis", "gross_headroom_eur",\n    "friction_budget_eur", "cross_price_gap_pct", "research_state",\n]\n''',
              '''CROSS_PRICE_FIELDS = COMMON_FIELDS + [\n    "reference_band", "reference_value_eur", "reference_basis",\n    "screening_acquisition_eur", "screening_acquisition_source", "acquisition_basis",\n    "gross_headroom_eur", "friction_budget_eur", "cross_price_gap_pct", "research_state",\n    "identity_source", "cardtrader_version",\n]\n'''
          )

          # 3) Enrich missing set/collector number only from unique exact CardTrader mappings.
          replace_once(
              'scripts/enrich_cross_price_cardtrader.py',
              '''def panel(conn, cfg: dict) -> list[dict]:\n    return build_cross_price_research(scored_rows(latest_rows_with_history(conn), cfg), cfg)\n\n\ndef main() -> int:\n''',
              '''def panel(conn, cfg: dict) -> list[dict]:\n    return build_cross_price_research(scored_rows(latest_rows_with_history(conn), cfg), cfg)\n\n\ndef enrich_exact_identity(conn, rows: list[dict]) -> None:\n    """Fill missing set/number only when CardTrader exact mapping resolves uniquely."""\n    for row in rows:\n        if row.get("expansion_name") and row.get("number"):\n            row["identity_source"] = "CARDMARKET_CATALOG"\n            continue\n        pid = int(row["id_product"])\n        mapped = conn.execute(\n            """\n            SELECT DISTINCT\n                   trim(coalesce(b.expansion_name,'')) AS expansion_name,\n                   trim(coalesce(b.collector_number,'')) AS collector_number,\n                   trim(coalesce(b.version,'')) AS version\n            FROM cardtrader_blueprint_map m\n            JOIN cardtrader_blueprints b ON b.blueprint_id=m.blueprint_id\n            WHERE m.id_product=?\n            """,\n            (pid,),\n        ).fetchall()\n        exact = {\n            (str(r["expansion_name"] or "").strip(), str(r["collector_number"] or "").strip())\n            for r in mapped\n            if str(r["expansion_name"] or "").strip() and str(r["collector_number"] or "").strip()\n        }\n        if len(exact) == 1:\n            expansion_name, number = next(iter(exact))\n            if not row.get("expansion_name"):\n                row["expansion_name"] = expansion_name\n            if not row.get("number"):\n                row["number"] = number\n            versions = {str(r["version"] or "").strip() for r in mapped if str(r["version"] or "").strip()}\n            if len(versions) == 1:\n                row["cardtrader_version"] = next(iter(versions))\n            row["identity_source"] = "CARDTRADER_EXACT_MAPPING"\n        else:\n            row["identity_source"] = "UNRESOLVED" if not (row.get("expansion_name") or row.get("number")) else "PARTIAL_CARDMARKET_CATALOG"\n\n\ndef main() -> int:\n'''
          )
          replace_once(
              'scripts/enrich_cross_price_cardtrader.py',
              '''        selected = panel(conn, cfg)\n        write_csv(output_path, selected, CROSS_PRICE_FIELDS)\n''',
              '''        selected = panel(conn, cfg)\n        enrich_exact_identity(conn, selected)\n        write_csv(output_path, selected, CROSS_PRICE_FIELDS)\n'''
          )

          # 4) Public dashboard snapshot retains source and identity provenance.
          replace_once(
              'scripts/apply_cross_price_to_dashboard.py',
              '''        "screening_acquisition_eur": screening,\n        "acquisition_basis": source.get("acquisition_basis"),\n        "gross_headroom_eur": headroom,\n''',
              '''        "screening_acquisition_eur": screening,\n        "screening_acquisition_source": source.get("screening_acquisition_source"),\n        "acquisition_basis": source.get("acquisition_basis"),\n        "identity_source": source.get("identity_source"),\n        "cardtrader_version": source.get("cardtrader_version"),\n        "gross_headroom_eur": headroom,\n'''
          )

          # 5) Main dashboard: richer exact identity context and explicit buy-source website.
          replace_once(
              'dashboard/app.py',
              '''def card_context(row: dict) -> str:\n    bits = []\n    if clean_text(row.get("expansion_name")):\n        bits.append(str(row["expansion_name"]))\n    if clean_text(row.get("number")):\n        bits.append(f"#{row['number']}")\n    if bits:\n        return " · ".join(bits)\n    pid = clean_text(row.get("id_product"))\n    return f"Cardmarket ID {pid}" if pid else "Exact set/number not available in snapshot"\n''',
              '''def card_context(row: dict) -> str:\n    bits = []\n    if clean_text(row.get("expansion_name")):\n        bits.append(f"Set: {row['expansion_name']}")\n    if clean_text(row.get("number")):\n        bits.append(f"No. {row['number']}")\n    if clean_text(row.get("cardtrader_version")):\n        bits.append(f"Variant: {row['cardtrader_version']}")\n    if clean_text(row.get("rarity")):\n        bits.append(f"Rarity: {row['rarity']}")\n    pid = clean_text(row.get("id_product"))\n    if pid:\n        bits.append(f"Cardmarket ID {pid}")\n    return " · ".join(bits) if bits else "Exact set/number not available in snapshot"\n\n\ndef acquisition_source_text(row: dict) -> str:\n    explicit = (clean_text(row.get("screening_acquisition_source")) or "").upper()\n    labels = {\n        "CARDTRADER_EN_NM": "CardTrader — English/NM ask",\n        "CARDMARKET_EN_NM": "Cardmarket — English/NM floor",\n        "CARDMARKET_EN_NM+CARDTRADER_EN_NM": "Cardmarket + CardTrader — same English/NM floor",\n        "CARDTRADER_EN_NM+CARDMARKET_EN_NM": "Cardmarket + CardTrader — same English/NM floor",\n        "CARDMARKET_GENERIC_LOW": "Cardmarket — generic low (screening only)",\n        "VALIDATED_EN_NM_SOURCE_UNRESOLVED": "Validated EN/NM source not retained",\n    }\n    if explicit in labels:\n        return labels[explicit]\n    buy = as_float(row.get("best_validated_sourcing_price"))\n    cm = as_float(row.get("cm_en_nm_floor"))\n    ct = as_float(row.get("ct_en_nm_floor"))\n    if buy is not None:\n        if ct is not None and abs(ct - buy) < 0.005 and not (cm is not None and abs(cm - buy) < 0.005):\n            return "CardTrader — English/NM ask"\n        if cm is not None and abs(cm - buy) < 0.005 and not (ct is not None and abs(ct - buy) < 0.005):\n            return "Cardmarket — English/NM floor"\n        if cm is not None and ct is not None and abs(cm - buy) < 0.005 and abs(ct - buy) < 0.005:\n            return "Cardmarket + CardTrader — same English/NM floor"\n    return "Source not retained in this snapshot"\n'''
          )
          replace_once(
              'dashboard/app.py',
              '''def discovery_summary_rows(rows: list[dict]) -> list[dict]:\n    return [{\n        "Card": short_name(row.get("name")),\n        "Scanner status": clean_text(row.get("status")) or "—",\n        "Candidate buy": as_float(row.get("best_validated_sourcing_price")),\n        "30d average": as_float(row.get("avg30")),\n        "Gap %": as_float(row.get("gap_pct")),\n        "Deal score": as_float(row.get("deal_score")),\n        "CT sellers": as_float(row.get("ct_visible_sellers")),\n    } for row in rows]\n''',
              '''def discovery_summary_rows(rows: list[dict]) -> list[dict]:\n    return [{\n        "Card": short_name(row.get("name")),\n        "Set": clean_text(row.get("expansion_name")) or "—",\n        "No.": clean_text(row.get("number")) or "—",\n        "Scanner status": clean_text(row.get("status")) or "—",\n        "Candidate buy": as_float(row.get("best_validated_sourcing_price")),\n        "Buy source": acquisition_source_text(row),\n        "30d average": as_float(row.get("avg30")),\n        "Gap %": as_float(row.get("gap_pct")),\n        "Deal score": as_float(row.get("deal_score")),\n        "CT sellers": as_float(row.get("ct_visible_sellers")),\n    } for row in rows]\n'''
          )
          replace_once(
              'dashboard/app.py',
              '''                c1, c2, c3, c4 = st.columns(4)\n                c1.metric("Candidate buy", format_eur(card.get("best_validated_sourcing_price")))\n                c2.metric("30d average", format_eur(card.get("avg30")))\n                c3.metric("Gap", format_pct(card.get("gap_pct")))\n                c4.metric("Deal score", format_score(card.get("deal_score")))\n                sellers = as_int(card.get("ct_visible_sellers"))\n''',
              '''                c1, c2, c3, c4 = st.columns(4)\n                c1.metric("Candidate buy", format_eur(card.get("best_validated_sourcing_price")))\n                c2.metric("30d average", format_eur(card.get("avg30")))\n                c3.metric("Gap", format_pct(card.get("gap_pct")))\n                c4.metric("Deal score", format_score(card.get("deal_score")))\n                st.markdown(f"**Candidate buy source:** {acquisition_source_text(card)}")\n                st.caption("Candidate buy is a source ask/floor, not a landed cost. Shipping, fees and Ireland eligibility still need route validation unless explicitly stated otherwise.")\n                sellers = as_int(card.get("ct_visible_sellers"))\n'''
          )

          # 6) Cross-price page also shows exact identity and source website.
          replace_once(
              'dashboard/pages/2_Cross-price_research.py',
              '''            "Card": short_name(row.get("name")),\n            "Band": row.get("reference_band"),\n            "Screening acquisition": as_float(row.get("screening_acquisition_eur")),\n            "Acquisition evidence": compact_basis(row.get("acquisition_basis")),\n''',
              '''            "Card": short_name(row.get("name")),\n            "Set": row.get("expansion_name") or "—",\n            "No.": row.get("number") or "—",\n            "Band": row.get("reference_band"),\n            "Screening acquisition": as_float(row.get("screening_acquisition_eur")),\n            "Buy source": str(row.get("screening_acquisition_source") or "UNKNOWN").replace("_", " "),\n            "Acquisition evidence": compact_basis(row.get("acquisition_basis")),\n'''
          )

          # 7) Unit coverage for acquisition-source provenance.
          p = Path('tests/test_cross_price.py')
          text = p.read_text(encoding='utf-8')
          addition = '''\n\ndef test_acquisition_source_tracks_cardtrader_vs_cardmarket_generic():\n    cfg = {\n        "rules": {"min_product_age_days_for_flip_signal": 14},\n        "cross_price_research": {"candidates_per_band": 2},\n    }\n    validated = row(10, 40.0, 20.0, validated=25.0)\n    validated["ct_en_nm_floor"] = 25.0\n    generic = row(11, 40.0, 20.0)\n    selected = build_cross_price_research([validated, generic], cfg)\n    by_id = {r["id_product"]: r for r in selected}\n    assert by_id[10]["screening_acquisition_source"] == "CARDTRADER_EN_NM"\n    assert by_id[11]["screening_acquisition_source"] == "CARDMARKET_GENERIC_LOW"\n'''
          if 'test_acquisition_source_tracks_cardtrader_vs_cardmarket_generic' in text:
              raise SystemExit('tests/test_cross_price.py: test already present')
          p.write_text(text + addition, encoding='utf-8')

          # 8) Future cross-price code changes should automatically refresh the hosted preview.
          replace_once(
              '.github/workflows/cross_price_research_preview.yml',
              '''  push:\n    paths:\n      - '.github/workflows/cross_price_research_preview.yml'\n''',
              '''  push:\n    paths:\n      - '.github/workflows/cross_price_research_preview.yml'\n      - 'src/deal_scanner/cross_price.py'\n      - 'src/deal_scanner/reports.py'\n      - 'scripts/enrich_cross_price_cardtrader.py'\n      - 'scripts/apply_cross_price_to_dashboard.py'\n'''
          )
          PY

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Commit upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pokemon-deal-scanner-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add src/deal_scanner/cross_price.py src/deal_scanner/reports.py scripts/enrich_cross_price_cardtrader.py scripts/apply_cross_price_to_dashboard.py dashboard/app.py dashboard/pages/2_Cross-price_research.py tests/test_cross_price.py .github/workflows/cross_price_research_preview.yml
          git commit -m "Show exact card identity and acquisition source"
          git push origin HEAD:main
