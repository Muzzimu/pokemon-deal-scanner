name: Apply dashboard card image layout

on:
  push:
    paths:
      - '.github/dashboard-card-images-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact-image layout patch
        run: python scripts/patch_dashboard_card_images.py

      - name: Syntax check dashboard
        run: |
          python -m py_compile dashboard/app.py dashboard/pages/1_Owned_cards.py

      - name: Run dashboard tests
        run: |
          python -m pip install -r requirements.txt
          pytest -q tests -x

      - name: Commit dashboard image layout
        shell: bash
        run: |
          git config user.name "pokemon-deal-scanner-dashboard"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard/app.py dashboard/pages/1_Owned_cards.py docs/DASHBOARD.md
          if git diff --cached --quiet; then
            echo "No layout changes to commit"
            exit 0
          fi
          git commit -m "Add exact card artwork to dashboard layout"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
