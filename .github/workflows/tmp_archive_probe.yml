name: Temporary Adverts Archive Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tmp_archive_probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Probe third-party archives
        run: python scripts/probe_adverts_archives.py
      - name: Upload probe results
        uses: actions/upload-artifact@v4
        with:
          name: adverts-archive-probe-${{ github.run_id }}
          path: output/archive_probe/*
          retention-days: 14
