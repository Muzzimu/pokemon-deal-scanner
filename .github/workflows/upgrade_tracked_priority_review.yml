name: Upgrade tracked-card Priority Review

on:
  push:
    paths:
      - '.github/workflows/upgrade_tracked_priority_review.yml'
      - 'scripts/upgrade_tracked_priority_review.py'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore latest scanner database state
        uses: actions/cache/restore@v4
        with:
          path: db/pokemon_deal_scanner.sqlite
          key: tracked-priority-${{ github.run_id }}
          restore-keys: |
            pokemon-scanner-db-

      - name: Apply tracked Priority Review upgrade
        run: python scripts/upgrade_tracked_priority_review.py

      - name: Syntax check dashboard and exporter
        run: python -m py_compile dashboard/app.py scripts/export_dashboard_snapshot.py

      - name: Commit upgrade and clean temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pokemon-deal-scanner-dashboard"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/upgrade_tracked_priority_review.yml .github/workflows/debug_resolve_tracked_purchases.yml scripts/upgrade_tracked_priority_review.py
          git add dashboard/app.py dashboard/data/dashboard_snapshot.json scripts/export_dashboard_snapshot.py data/reference/tracked_review_cards.csv docs/DASHBOARD.md
          git commit -m "Add tracked cards to Priority Review [skip ci]"
          git push origin HEAD:main
