name: Fix bundle density display

on:
  push:
    paths:
      - 'scripts/fix_bundle_density_display.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/fix_bundle_density_display.py
      - name: Validate
        env:
          PYTHONPATH: .:src
        run: |
          pip install -r requirements.txt
          python -m py_compile dashboard/app.py
          pytest -q
      - name: Commit
        run: |
          git config user.name "pokemon-deal-scanner-dashboard"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard/app.py tests/test_bundle_market_dashboard.py
          git commit -m "Fix bundle foil-density display" || exit 0
          git pull --rebase --autostash origin main
          git push origin HEAD:main
