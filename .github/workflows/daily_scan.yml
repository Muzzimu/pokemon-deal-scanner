name: Daily Pokemon Deal Scan

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Running at both hours plus the local-hour guard below
    # gives ~07:05 Europe/Dublin across daylight-saving changes.
    - cron: '5 6 * * *'
    - cron: '5 7 * * *'

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  PYTHONPATH: src
  CARDTRADER_API_TOKEN: ${{ secrets.CARDTRADER_API_TOKEN }}
  EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
  EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Dublin local hour
        id: timecheck
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$(TZ=Europe/Dublin date +%H)" == "07" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.timecheck.outputs.run == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: steps.timecheck.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Run tests
        if: steps.timecheck.outputs.run == 'true'
        run: pytest -q

      - name: Restore scanner database state
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: db/pokemon_deal_scanner.sqlite
          key: pokemon-scanner-db-${{ github.run_id }}
          restore-keys: |
            pokemon-scanner-db-

      - name: Run scanner
        if: steps.timecheck.outputs.run == 'true'
        run: python scripts/run_daily.py --no-archive

      - name: Exact PGO076 CardTrader test
        if: steps.timecheck.outputs.run == 'true' && env.CARDTRADER_API_TOKEN != ''
        run: python scripts/diagnose_pgo076.py

      - name: Save scanner database state
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: db/pokemon_deal_scanner.sqlite
          key: pokemon-scanner-db-${{ github.run_id }}

      - name: Upload daily reports
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-deal-scan-${{ github.run_id }}
          path: |
            output/*.csv
            output/*.json
          retention-days: 30
