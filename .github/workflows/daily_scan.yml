name: Daily Pokemon Deal Scan

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. We deliberately avoid :00/:05, when scheduled Actions
    # are more likely to be delayed under platform load. The 06/07 UTC pair handles
    # Irish daylight-saving time; the runtime guard allows any delayed scheduled
    # job to execute once Dublin has reached 07:00, while the daily marker prevents
    # duplicate full scans.
    - cron: '17,47 6,7 * * *'

permissions:
  contents: write

# Serialize redundant scheduled attempts. A later attempt waits for the earlier
# one, then restores the daily marker and skips if a full scan already succeeded.
concurrency:
  group: pokemon-daily-scan-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'
  PYTHONPATH: src
  CARDTRADER_API_TOKEN: ${{ secrets.CARDTRADER_API_TOKEN }}
  EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
  EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
  PARSE_API_KEY: ${{ secrets.PARSE_API_KEY }}
  BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Dublin clock
        id: clock
        shell: bash
        run: |
          echo "day=$(TZ=Europe/Dublin date +%F)" >> "$GITHUB_OUTPUT"
          echo "hour=$(TZ=Europe/Dublin date +%H)" >> "$GITHUB_OUTPUT"
          echo "time=$(TZ=Europe/Dublin date +%H:%M:%S)" >> "$GITHUB_OUTPUT"
          echo "weekday=$(TZ=Europe/Dublin date +%u)" >> "$GITHUB_OUTPUT"
          echo "iso_week=$(TZ=Europe/Dublin date +%G-W%V)" >> "$GITHUB_OUTPUT"
          echo "month=$(TZ=Europe/Dublin date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore today's successful-run marker
        id: daily_marker
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .daily-scan-marker
          key: pokemon-daily-scan-${{ steps.clock.outputs.day }}

      - name: Decide whether to run
        id: timecheck
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.daily_marker.outputs.cache-hit }}" == "true" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=already-ran-today" >> "$GITHUB_OUTPUT"
          elif (( 10#${{ steps.clock.outputs.hour }} < 7 )); then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=before-dublin-07-hour" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=scheduled-primary-fallback-or-delayed" >> "$GITHUB_OUTPUT"
          fi
          echo "Dublin time: ${{ steps.clock.outputs.time }}; decision written to outputs"

      - uses: actions/setup-python@v5
        if: steps.timecheck.outputs.run == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: steps.timecheck.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Run tests
        if: steps.timecheck.outputs.run == 'true'
        run: pytest -q

      - name: Restore scanner database state
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: db/pokemon_deal_scanner.sqlite
          key: pokemon-scanner-db-${{ github.run_id }}
          restore-keys: |
            pokemon-scanner-db-

      - name: Run scanner
        if: steps.timecheck.outputs.run == 'true'
        run: python scripts/run_daily.py --no-archive

      - name: Build monthly model validation report
        if: steps.timecheck.outputs.run == 'true'
        run: python scripts/generate_model_monthly_report.py

      - name: Build market trend signals
        if: steps.timecheck.outputs.run == 'true'
        run: python scripts/generate_market_signals.py

      - name: Scan Gumtree and build arbitrage candidates
        if: steps.timecheck.outputs.run == 'true'
        run: python scripts/generate_classified_arbitrage.py

      - name: Exact PGO076 CardTrader test
        if: steps.timecheck.outputs.run == 'true' && env.CARDTRADER_API_TOKEN != ''
        run: python scripts/diagnose_pgo076.py

      - name: Exact Dragonite trio CardTrader test
        if: steps.timecheck.outputs.run == 'true' && env.CARDTRADER_API_TOKEN != ''
        run: python scripts/diagnose_dragonite_trio.py

      - name: Export web dashboard snapshot
        if: steps.timecheck.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/export_dashboard_snapshot.py

      - name: Save scanner database state
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: db/pokemon_deal_scanner.sqlite
          key: pokemon-scanner-db-${{ github.run_id }}

      - name: Publish web dashboard snapshot
        if: steps.timecheck.outputs.run == 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pokemon-deal-scanner-dashboard"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard/data/dashboard_snapshot.json
          if git diff --cached --quiet; then
            echo "Dashboard snapshot unchanged"
            exit 0
          fi
          git commit -m "Update dashboard snapshot ${{ steps.clock.outputs.day }} [skip ci]"
          git fetch origin main
          if ! git -c rebase.autoStash=true rebase origin/main; then
            git rebase --abort || true
            echo "Dashboard snapshot publish skipped because main advanced incompatibly"
            exit 1
          fi
          git push origin HEAD:main
          echo "Dashboard snapshot published to main"

      - name: Durable weekly/monthly research backup
        if: steps.timecheck.outputs.run == 'true' && env.BACKUP_REPO_TOKEN != '' && (github.event_name == 'workflow_dispatch' || steps.clock.outputs.weekday == '7')
        continue-on-error: true
        shell: bash
        env:
          BACKUP_REPO: Muzzimu/pokemon-deal-scanner-backup
          BACKUP_DAY: ${{ steps.clock.outputs.day }}
          BACKUP_WEEK: ${{ steps.clock.outputs.iso_week }}
          BACKUP_MONTH: ${{ steps.clock.outputs.month }}
        run: |
          set -euo pipefail

          # Force a clean SQLite checkpoint and verify integrity before copying it.
          python - <<'PY'
          import sqlite3
          path = "db/pokemon_deal_scanner.sqlite"
          conn = sqlite3.connect(path)
          result = conn.execute("PRAGMA integrity_check").fetchone()[0]
          if result != "ok":
              raise SystemExit(f"SQLite integrity_check failed: {result}")
          conn.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          conn.close()
          print("SQLite integrity_check: ok")
          PY

          rm -rf .durable-backup-stage .durable-backup-repo
          mkdir -p .durable-backup-stage/payload/db .durable-backup-stage/payload/output
          cp db/pokemon_deal_scanner.sqlite .durable-backup-stage/payload/db/

          # Preserve the research/model state most useful for audit and reconstruction.
          for f in \
            output/model_predictions.csv \
            output/model_outcomes.csv \
            output/model_calibration.csv \
            output/model_validation_summary.json \
            output/model_monthly_report.csv \
            output/model_monthly_report.json \
            output/market_quality.csv \
            output/tcgcsv_market_reference.csv \
            output/tcgcsv_mapping_audit.csv \
            output/scanner_status.json; do
            if [[ -f "$f" ]]; then
              cp "$f" .durable-backup-stage/payload/output/
            fi
          done

          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          db = Path(".durable-backup-stage/payload/db/pokemon_deal_scanner.sqlite")
          manifest = {
              "backup_schema": 1,
              "backup_day_dublin": os.environ["BACKUP_DAY"],
              "backup_iso_week": os.environ["BACKUP_WEEK"],
              "backup_month": os.environ["BACKUP_MONTH"],
              "source_repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": os.environ["GITHUB_SHA"],
              "source_run_id": os.environ["GITHUB_RUN_ID"],
              "database_sha256": hashlib.sha256(db.read_bytes()).hexdigest(),
          }
          Path(".durable-backup-stage/payload/manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY

          tar -C .durable-backup-stage/payload -czf ".durable-backup-stage/${BACKUP_WEEK}.tar.gz" .

          # Use a fine-grained token restricted to the private backup repository.
          git config --global user.name "pokemon-deal-scanner-backup"
          git config --global user.email "actions@users.noreply.github.com"
          git config --global credential.helper store
          printf 'https://x-access-token:%s@github.com\n' "$BACKUP_REPO_TOKEN" > "$HOME/.git-credentials"
          trap 'rm -f "$HOME/.git-credentials"' EXIT

          git clone "https://github.com/${BACKUP_REPO}.git" .durable-backup-repo || {
            echo "Unable to clone backup repository"
            exit 1
          }
          cd .durable-backup-repo

          # An empty newly-created repository is supported as well.
          git checkout -B main
          mkdir -p weekly monthly
          cp "${GITHUB_WORKSPACE}/.durable-backup-stage/${BACKUP_WEEK}.tar.gz" "weekly/${BACKUP_WEEK}.tar.gz"

          # First successful weekly/manual backup of a month also becomes the durable monthly checkpoint.
          if [[ ! -f "monthly/${BACKUP_MONTH}.tar.gz" ]]; then
            cp "weekly/${BACKUP_WEEK}.tar.gz" "monthly/${BACKUP_MONTH}.tar.gz"
          fi

          cat > README.md <<'EOF'
          # Pokémon Deal Scanner — durable research backups

          Private durable backup target for `Muzzimu/pokemon-deal-scanner`.

          - `weekly/YYYY-Www.tar.gz`: SQLite research database plus key model-validation outputs.
          - `monthly/YYYY-MM.tar.gz`: first successful weekly/manual checkpoint retained for each month.
          - Each archive contains `manifest.json` with source commit/run and a SHA-256 of the SQLite database.

          The operational Actions cache is convenient but disposable; this repository is the long-term recovery layer for walk-forward T+1/T+3/T+7/T+14/T+30 and T+90/T+180 research history.
          EOF

          git add README.md weekly monthly
          if git diff --cached --quiet; then
            echo "Durable backup already current"
            exit 0
          fi
          git commit -m "Backup ${BACKUP_DAY} (${BACKUP_WEEK}) from run ${GITHUB_RUN_ID}"
          git push origin main
          echo "Durable backup pushed to ${BACKUP_REPO}"

      - name: Upload daily reports
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-deal-scan-${{ github.run_id }}
          path: |
            output/*.csv
            output/*.json
          retention-days: 90

      - name: Create today's success marker
        if: success() && github.event_name == 'schedule' && steps.timecheck.outputs.run == 'true'
        shell: bash
        run: |
          mkdir -p .daily-scan-marker
          echo "run_id=${{ github.run_id }}" > ".daily-scan-marker/${{ steps.clock.outputs.day }}.txt"
          echo "dublin_time=${{ steps.clock.outputs.time }}" >> ".daily-scan-marker/${{ steps.clock.outputs.day }}.txt"

      - name: Save today's successful-run marker
        if: success() && github.event_name == 'schedule' && steps.timecheck.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: .daily-scan-marker
          key: pokemon-daily-scan-${{ steps.clock.outputs.day }}
