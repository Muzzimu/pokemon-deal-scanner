name: Owned cards market refresh

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Daily Pokemon Deal Scan
    types:
      - completed
  schedule:
    # Fallback only. The normal refresh runs after a successful daily scanner run.
    - cron: '20 9 * * *'
  push:
    paths:
      - 'scripts/refresh_owned_market.py'
      - 'data/reference/owned_resale_cards.csv'

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'
  PYTHONPATH: src
  CARDTRADER_API_TOKEN: ${{ secrets.CARDTRADER_API_TOKEN }}
  PARSE_API_KEY: ${{ secrets.PARSE_API_KEY }}

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether fallback refresh is needed
        id: refresh_gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          event = os.environ.get('GITHUB_EVENT_NAME', '')
          should_run = True
          reason = f'{event} trigger'

          # Scheduled execution is a fallback. If today's owned-market snapshot was
          # already generated by the post-scanner workflow, do not spend provider
          # requests a second time. Push/manual/workflow_run triggers remain explicit.
          if event == 'schedule':
              path = Path('dashboard/data/owned_market.json')
              if path.exists():
                  try:
                      payload = json.loads(path.read_text(encoding='utf-8'))
                      stamp = str(payload.get('generated_at_utc') or '')
                      generated = datetime.fromisoformat(stamp.replace('Z', '+00:00'))
                      if generated.astimezone(timezone.utc).date() == datetime.now(timezone.utc).date():
                          should_run = False
                          reason = f'already refreshed today at {stamp}'
                  except Exception as exc:
                      reason = f'could not validate prior snapshot ({type(exc).__name__}); run fallback'

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"run={'true' if should_run else 'false'}\n")
              out.write(f"reason={reason}\n")
          print(f"owned-market refresh: run={should_run} reason={reason}")
          PY

      - uses: actions/setup-python@v5
        if: steps.refresh_gate.outputs.run == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: steps.refresh_gate.outputs.run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Restore latest scanner database state
        if: steps.refresh_gate.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: db/pokemon_deal_scanner.sqlite
          key: owned-market-${{ github.run_id }}
          restore-keys: |
            pokemon-scanner-db-

      - name: Refresh comparable asks for owned cards
        if: steps.refresh_gate.outputs.run == 'true'
        run: python scripts/refresh_owned_market.py

      - name: Commit owned-card market snapshot
        if: steps.refresh_gate.outputs.run == 'true'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- dashboard/data/owned_market.json)" ]; then
            echo "No owned-market changes to commit"
            exit 0
          fi
          git config user.name "pokemon-deal-scanner-dashboard"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard/data/owned_market.json
          git commit -m "Refresh owned-card market asks [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
