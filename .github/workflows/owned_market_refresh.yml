name: Owned cards market refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '20 9 * * *'
  push:
    paths:
      - 'scripts/refresh_owned_market.py'
      - 'data/reference/owned_resale_cards.csv'
      - '.github/workflows/owned_market_refresh.yml'

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'
  PYTHONPATH: src
  CARDTRADER_API_TOKEN: ${{ secrets.CARDTRADER_API_TOKEN }}
  PARSE_API_KEY: ${{ secrets.PARSE_API_KEY }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore latest scanner database state
        uses: actions/cache/restore@v4
        with:
          path: db/pokemon_deal_scanner.sqlite
          key: owned-market-${{ github.run_id }}
          restore-keys: |
            pokemon-scanner-db-

      - name: Refresh comparable asks for owned cards
        run: python scripts/refresh_owned_market.py

      - name: Commit owned-card market snapshot
        shell: bash
        run: |
          if git diff --quiet -- dashboard/data/owned_market.json; then
            echo "No owned-market changes to commit"
            exit 0
          fi
          git config user.name "pokemon-deal-scanner-dashboard"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard/data/owned_market.json
          git commit -m "Refresh owned-card market asks [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
