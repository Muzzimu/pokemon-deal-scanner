name: Scanner CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'dashboard/**'
      - 'tests/**'
      - 'config.yaml'
      - 'requirements.txt'
      - 'requirements-dashboard.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'dashboard/**'
      - 'tests/**'
      - 'config.yaml'
      - 'requirements.txt'
      - 'requirements-dashboard.txt'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile dashboard/exporter
        run: python -m py_compile dashboard/app.py scripts/export_dashboard_snapshot.py
      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest -q
